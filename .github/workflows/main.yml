name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Sign APK and write report
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/debug/app-debug.apk aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out AutoReply.apk aligned.apk
          {
            echo "== apksigner verify =="
            "$BT/apksigner" verify -v --print-certs AutoReply.apk || true
            echo
            echo "== aapt2 badging =="
            "$BT/aapt2" dump badging AutoReply.apk | head -3
            echo
            echo "== META-INF =="
            unzip -l AutoReply.apk | grep META-INF
          } > verify.txt 2>&1
          cat verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AutoReply
          path: AutoReply.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body_path: verify.txt
          files: AutoReply.apk

      - name: Check v2 present
        run: grep -q "v2 scheme (APK Signature Scheme v2): true" verify.txt
